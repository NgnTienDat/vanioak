<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>VaniOAK — Engineer Workspace Prototype</title>
  <style>
    :root { --bg:#0d1015; --surface:#12161c; --surface2:#171c23; --surface3:#1d232b; --panel:#131820; --stroke:#29313b; --stroke2:#323a46; --text:#e9edf2; --muted:#939da9; --faint:#697482; --green:#36d6ad; --green-dark:#183a33; --red:#f57983; --red-dark:#3b2329; --orange:#ffb45f; --blue:#76a9ff; --shadow:0 20px 60px #0008; --radius:10px; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:13px; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; } button { cursor:pointer; } button:disabled { opacity:.44;cursor:not-allowed; }
    input,select { outline:0; }
    a { color:inherit;text-decoration:none; }
    ::selection { color:#0b1614;background:#38d7ad; }
    ::-webkit-scrollbar { width:9px;height:8px; } ::-webkit-scrollbar-thumb{background:#353d47;border:2px solid #151920;border-radius:10px;} ::-webkit-scrollbar-track{background:#11151b;}

    .app-shell { display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh; }
    .sidebar { position:sticky;top:0;height:100vh;background:#101419;border-right:1px solid var(--stroke);display:flex;flex-direction:column;z-index:11; }
    .brand { height:68px;display:flex;align-items:center;gap:11px;padding:0 19px;border-bottom:1px solid var(--stroke);font-size:17px;font-weight:730;letter-spacing:-.6px; }
    .brandmark { width:31px;height:31px;border:1px solid #3cbaa0;border-radius:8px;background:linear-gradient(135deg,#1c423a,#113028);display:grid;place-items:center;color:#57e8c1; }
    .brand .ver { font-size:10px;font-weight:600;color:#737f8c;border:1px solid #343b45;padding:3px 6px;border-radius:5px;letter-spacing:0;margin-left:auto; }
    .app-switch { margin:20px 13px 11px;padding:11px 10px;display:flex;align-items:center;gap:10px;background:#191f25;border:1px solid #343a43;border-radius:9px;text-align:left;color:var(--text);width:calc(100% - 26px); }
    .app-switch:hover{border-color:#65756f;} .app-icon { display:grid;place-items:center;height:31px;width:31px;border-radius:8px;background:#22443b;color:#6ee7c6;flex-shrink:0; }
    .app-switch-name { font-weight:650;white-space:nowrap;max-width:137px;overflow:hidden;text-overflow:ellipsis; }
    .app-switch-sub { font-size:11px;color:var(--faint);padding-top:3px; }
    .section-label { font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:760;color:#737c87;margin:23px 22px 11px; }
    .nav-list { display:flex;flex-direction:column;gap:3px;padding:0 12px; }

    .nav-item:hover { color:#e8edf2;background:#1c2229; } .nav-item.active { color:#e9fff7;background:#1c322d; }
    .nav-item.active:before { content:"";width:3px;position:absolute;left:-12px;top:6px;bottom:6px;border-radius:2px;background:var(--green); }
    .nav-item.active .icon { color:#65e5bc; }
    .sidebar-bottom { margin-top:auto;border-top:1px solid var(--stroke);padding:13px; }

    .account { display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;background:transparent;color:#d9dfe5;border:0;width:100%;text-align:left; } .account:hover { background:#1d232b; }
    .avatar { display:grid;place-items:center;width:33px;height:33px;border-radius:50%;background:#364a60;color:#cfebff;font-size:11px;font-weight:750; }
    .account-meta { flex:1;min-width:0; } .account-name { font-weight:630; } .account-role {color:var(--muted);font-size:11px;margin-top:2px;}
    .workspace { min-width:0; }
    .topbar { height:68px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:18px;background:rgba(16,20,25,.95); }

    .breadcrumb strong {color:#edf2f7;font-weight:630;overflow:hidden;text-overflow:ellipsis;} .bread-divider{color:#515b67;}
    .top-actions { display:flex;align-items:center;gap:10px; }

    .select-wrap select { color:#e2e8ee;border:0;background:transparent;min-width:72px;cursor:pointer; } .select-wrap select option{background:#222932;}
    .top-icon { display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--stroke2);border-radius:7px;background:#171c22;color:#b3beca; }
    .main { padding:32px 38px 64px;max-width:1660px;margin:auto; }
    .eyebrow { color:var(--green);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:760;margin:0 0 9px; }
    h1,h2,h3,p { margin-top:0; } h1{font-size:27px;font-weight:720;letter-spacing:-.8px;margin-bottom:7px;} h2{font-size:16px;font-weight:690;letter-spacing:-.25px;margin-bottom:0;} h3{font-size:13px;font-weight:650;margin:0;} .subtitle {color:var(--muted);line-height:1.6;margin:0;font-size:13px;}
    .page-heading {display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:27px;} .heading-actions{display:flex;align-items:center;gap:9px;flex-shrink:0;}

    .btn:hover{background:#242c36;border-color:#4a5967;} .btn-primary {background:#2ebd98;border-color:#2ebd98;color:#06251c;} .btn-primary:hover {background:#58dcb7;border-color:#58dcb7;} .btn-danger{background:#57292f;border-color:#87434c;color:#ffc1c6;} .btn-danger:hover{background:#70343c;} .btn-ghost{background:transparent;border-color:transparent;}.btn-ghost:hover{background:#1d242d;border-color:#1d242d;}
    .btn-sm {min-height:30px;padding:6px 10px;font-size:11px;} .btn-wide {width:100%;}
    .panel {background:var(--surface);border:1px solid var(--stroke);border-radius:10px;min-width:0;overflow:hidden;}
    .panel-head {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--stroke);} .panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px;}
    .tag { display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;padding:5px 8px;border-radius:5px;border:1px solid #3c444d;color:#bac3cc;background:#232931;white-space:nowrap; }
    .tag.green {background:#163b31;border-color:#236f57;color:#68e1b6;} .tag.red {background:#40242c;border-color:#6a313d;color:#ff939c;} .tag.orange {background:#3b2b1b;border-color:#665033;color:#f1bd75;} .tag.blue{background:#1c3047;border-color:#355b7d;color:#93c5ff;} .tag.muted{background:#242a32;border-color:#363f49;color:#b6c0cb;} .tag.cyan{background:#183741;border-color:#2e6370;color:#7bcfdb;}
    .dot {width:7px;height:7px;border-radius:100%;background:currentColor;flex-shrink:0;display:inline-block;} .dot.pulse {box-shadow:0 0 0 4px #36d6ad19;animation:pulse 2s infinite;} @keyframes pulse{50%{box-shadow:0 0 0 7px #36d6ad08;}}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:19px;} .kpi {padding:19px 20px;background:var(--surface);border:1px solid var(--stroke);border-radius:9px;} .kpi-title{font-size:12px;color:#a4afbb;display:flex;justify-content:space-between;align-items:center;} .kpi-title .icon{color:#798590;} .kpi-val{font-size:30px;font-weight:725;letter-spacing:-1.1px;margin-top:14px;line-height:1;} .kpi-sub{margin-top:12px;font-size:11px;color:#818e9b;} .kpi-up{color:#61d2a7;} .kpi-warn{color:#feb975;}
    .split-grid{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(290px,.95fr);gap:18px;margin-bottom:19px;} .chart-body{padding:10px 20px 17px;} .chart-legend{display:flex;align-items:center;gap:18px;color:#9ba7b4;font-size:11px;padding:0 0 9px;} .legend-marker{display:inline-block;height:8px;width:8px;border-radius:50%;margin-right:6px;} .chart-svg{width:100%;height:213px;display:block;} .chart-grid{stroke:#29333c;stroke-width:1;stroke-dasharray:4 5;} .chart-label{fill:#82909c;font-size:11px;} .bar-grid{display:flex;align-items:flex-end;gap:8px;height:200px;padding:15px 4px 0;border-bottom:1px solid #38404b;} .bar-stack{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;} .bar-stack .barpart{border-radius:3px 3px 0 0;min-height:3px;} .bar-labels{display:flex;justify-content:space-between;color:#83909e;padding-top:11px;font-size:10px;}
    .env-row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #252d36;} .env-row:last-child{border-bottom:0;} .env-name{min-width:80px;font-weight:590;} .track{height:8px;border-radius:10px;background:#27313a;flex:1;overflow:hidden;} .track > span{height:100%;display:block;background:linear-gradient(90deg,#249b80,#58dbb6);border-radius:10px;} .env-number{font-variant-numeric:tabular-nums;min-width:60px;text-align:right;color:#c1cbd5;}
    .table-scroll{overflow:auto;max-width:100%;} table{width:100%;border-collapse:collapse;text-align:left;} th{font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:720;color:#7e8b99;padding:13px 17px;background:#161b21;border-bottom:1px solid #2a323b;white-space:nowrap;} td{padding:14px 17px;border-bottom:1px solid #252c35;color:#cbd4dd;font-size:12px;white-space:nowrap;} tr:last-child td{border-bottom:0;} tbody tr.click-row{cursor:pointer;} tbody tr.click-row:hover{background:#1c242b;} .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;letter-spacing:-.2px;} .muted{color:var(--muted);} .dim{color:var(--faint);} .strong{font-weight:650;color:#eaf1f5;} .ellipsis{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .table-msg{min-width:300px;max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .level {font-weight:720;letter-spacing:.45px;font-size:10px;} .level.ERROR{color:#ff8b95;}.level.CRITICAL{color:#ff616e;}.level.WARN{color:#ffc078;}.level.INFO{color:#6ddec0;}
    .table-footer{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;color:#8895a2;border-top:1px solid #29313a;gap:10px;font-size:11px;}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--stroke);} .field{border:1px solid #363e48;background:#191f26;border-radius:7px;color:#e3e9ee;height:36px;padding:0 11px;} .field:focus{border-color:#40b99c;box-shadow:0 0 0 3px #3ed5af12;} .field::placeholder{color:#778391;} .search-wrap{position:relative;flex:1;min-width:190px;}.search-wrap .icon{position:absolute;left:11px;top:10px;color:#73818d;width:16px;height:16px;}.search-wrap input{width:100%;padding-left:34px;} .toolbar select{min-width:115px;max-width:190px;} option{background:#1c242c;color:#e3e9ee;}
    .light-separator{height:1px;background:#29323c;margin:18px 0;} .inline-link{color:#72dfbf;cursor:pointer;font-weight:600;} .inline-link:hover{text-decoration:underline;}
    .list-incident{padding:17px 19px;display:flex;gap:13px;border-bottom:1px solid #2b323a;cursor:pointer;}.list-incident:hover{background:#1b222a;}.list-incident:last-child{border-bottom:0;} .incident-mark{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;background:#37232b;color:#f795a1;flex-shrink:0;} .incident-copy{min-width:0;flex:1;} .incident-title{font-weight:625;color:#e6ebf0;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;} .incident-desc{margin-top:8px;color:#8795a2;font-size:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
    .intro-banner{background:linear-gradient(110deg,#14261f,#142322 55%,#1a272a);border:1px solid #285342;border-radius:10px;padding:19px 22px;margin-bottom:19px;display:flex;align-items:center;justify-content:space-between;gap:12px;} .intro-banner h3{font-size:14px;margin:0 0 5px;color:#d5fbec;} .intro-banner p{color:#9fb9b0;margin:0;font-size:12px;line-height:1.55;}
    .tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--stroke);padding:0 18px;} .tab{padding:13px 15px;background:none;border:none;border-bottom:2px solid transparent;color:#9aa7b4;font-weight:590;}.tab.active{color:#6ce7be;border-color:#3acda4;} .tab:hover{color:#e5edf2;}
    .apps-page {min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#172923 0,transparent 50%),#0d1115;}.apps-top{height:72px;border-bottom:1px solid #2a323a;display:flex;justify-content:space-between;align-items:center;padding:0 max(28px,calc((100vw - 1110px)/2));}.apps-top .brand{border:0;padding:0;height:auto;}.apps-container{max-width:1110px;padding:60px 28px;margin:auto;}.apps-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px;}.app-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;}.app-card{background:#151a20;border:1px solid #303944;border-radius:10px;padding:22px;text-align:left;color:inherit;min-height:202px;display:flex;flex-direction:column;gap:13px;transition:transform .15s,border-color .15s;}.app-card:hover{border-color:#4da78d;transform:translateY(-2px);}.app-card-top{display:flex;align-items:center;justify-content:space-between;}.app-card-name{font-size:16px;font-weight:720;letter-spacing:-.2px;margin-top:2px;}.app-card-description{color:#9ca8b2;font-size:12px;line-height:1.6;min-height:40px;}.app-card-footer{border-top:1px solid #303842;padding-top:13px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#9aa7b2;font-size:11px;}.apps-info{display:flex;gap:10px;color:#a2b0ba;font-size:12px;margin-top:31px;align-items:center;}
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#0d1217;} .login-art{position:relative;padding:54px 7vw;background:radial-gradient(ellipse at 15% 30%,#143c32 0%,transparent 44%),linear-gradient(140deg,#0e171a,#0c1517);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #2a383a;}.login-art .brand{border:0;padding:0;height:auto;}.login-art-content{z-index:2;margin:auto 0;max-width:570px;}.login-art h1{font-size:49px;line-height:1.1;letter-spacing:-2.5px;margin:0 0 22px;}.login-art p{max-width:440px;color:#9fb7b0;font-size:15px;line-height:1.75;}.login-visual{position:relative;height:160px;margin-top:44px;border:1px solid #346051;border-radius:12px;background:#101f1bba;box-shadow:0 10px 50px #0005;overflow:hidden;padding:20px;}.login-visual .minibar{height:5px;border-radius:3px;margin:10px 0;background:#235347;}.login-visual .minibar:nth-child(2){width:77%;background:#34685a;}.login-visual .minibar:nth-child(3){width:65%;background:#2a564c;}.login-visual .minibar:nth-child(4){width:90%;background:#4b3a3a;}.login-visual .minibar:nth-child(5){width:54%;background:#235347;}.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:35px;}.login-form{width:100%;max-width:400px;}.login-form h2{font-size:27px;margin-bottom:8px;letter-spacing:-.8px;}.login-form p{color:#9aa6b3;margin-bottom:32px;line-height:1.6;}.form-label{display:block;color:#cad3db;font-size:12px;font-weight:620;margin:19px 0 9px;}.login-form .field{width:100%;height:43px;}.login-form .btn{height:44px;margin-top:21px;}.form-hint{padding:15px;border:1px solid #345047;background:#16271f;color:#a6d2c2;border-radius:8px;line-height:1.6;font-size:12px;margin-top:26px;}.form-hint strong{color:#b5f3d8;}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.9fr);gap:18px;}.detail-row{padding:12px 19px;display:grid;grid-template-columns:160px 1fr;align-items:start;gap:12px;border-bottom:1px solid #272e38;}.detail-row:last-child{border-bottom:0;}.detail-label{font-size:11px;color:#84929f;}.detail-val{font-size:12px;color:#dbe4eb;overflow-wrap:anywhere;}.timeline-item{padding:0 0 24px 30px;border-left:1px solid #3a4b4a;margin-left:9px;position:relative;}.timeline-item:last-child{border-left-color:transparent;padding-bottom:0;}.timeline-item:before{content:"";position:absolute;left:-6px;top:1px;width:11px;height:11px;background:#2d7d67;border:2px solid #193e33;border-radius:50%;}.timeline-event{font-weight:640;font-size:12px;color:#e4edf0;}.timeline-time{font-size:11px;color:#8f9aa6;margin-top:5px;}.timeline-note{font-size:12px;color:#b0bdc5;margin-top:10px;line-height:1.55;}
    .drawer-layer,.modal-layer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;}.drawer-scrim,.modal-scrim{position:absolute;inset:0;background:#020406b9;backdrop-filter:blur(2px);}.drawer{position:relative;width:min(540px,100vw);height:100vh;background:#151a20;border-left:1px solid #35404b;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:drawerIn .2s ease;}.drawer-header{padding:22px 24px;border-bottom:1px solid #313a44;display:flex;justify-content:space-between;align-items:center;}.drawer-body{padding:20px 24px;overflow:auto;flex:1;}.drawer-section{margin:24px 0 10px;color:#9aa7b2;font-size:11px;letter-spacing:.7px;text-transform:uppercase;font-weight:740;}.code-panel{background:#0d1217;border:1px solid #2e3741;border-radius:7px;padding:16px;font:12px/1.7 ui-monospace,monospace;color:#b6e2ce;white-space:pre-wrap;overflow-wrap:anywhere;}.modal-layer{justify-content:center;align-items:center;}.modal{position:relative;width:min(445px,calc(100vw - 24px));background:#171c23;border:1px solid #38414d;border-radius:12px;padding:26px;box-shadow:var(--shadow);}.modal p{color:#a4b0bb;line-height:1.7;margin:12px 0 24px;}.modal-actions{display:flex;justify-content:flex-end;gap:9px;}

    function renderOverview(){const ls=currentLogs().sort((a,b)=>b.timestamp.localeCompare(a.timestamp));const inc=currentIncidents();const open=inc.filter(i=>i.status==='OPEN');const error=ls.filter(l=>['ERROR','CRITICAL'].includes(l.level));
      const hours=state.time==='1h'?'the last hour':state.time==='7d'?'the last 7 days':'the last 24 hours';
      return `<div class="page-heading"><div><div class="eyebrow">Application health</div><h1>Overview</h1><p class="subtitle">Monitor ${escapeHtml(app().name)} across ${state.env==='ALL'?'all environments':state.env} · ${hours}</p></div><div class="heading-actions"><span class="tag green">${ic('circleCheck',13)} Service healthy</span><button class="btn" data-action="nav" data-page="logs">View logs ${ic('arrowRight',15)}</button></div></div><div class="intro-banner"><div><h3>${ic('activity',16)} Monitor your application in one place</h3><p>Investigate recent errors, explore activity and respond to incidents — updated with simulated demo data.</p></div><button class="btn btn-sm" data-action="simulate">${ic('bolt',14)} Simulate a log</button></div><div class="kpi-grid">${kpi('Total logs','12,486','logs','<span class="kpi-up">↗ 12.4%</span> vs previous period')}${kpi('Error logs','248','alert','<span class="kpi-warn">↗ 3.2%</span> vs previous period')}${kpi('Critical logs','16','bolt','In selected reporting window')}${kpi('Open incidents',String(open.length),'shield','Requiring attention',open.length?'#ffa0a6':'#74ebc2')}</div><div class="split-grid"><div class="panel"><div class="panel-head"><div><h2>Log activity</h2><p>Log volume over time · hourly aggregation</p></div><span class="tag muted">${ic('clock',12)} Hourly</span></div><div class="chart-body"><div class="chart-legend"><span><span class="legend-marker" style="background:#46d8ac"></span>Total log events</span><span class="muted">Sample analytics</span></div>${lineChart()}</div></div><div class="panel"><div class="panel-head"><div><h2>Recent incidents</h2><p>Current issues and recent resolutions</p></div><button class="btn btn-sm btn-ghost" data-action="nav" data-page="incidents">View all ${ic('arrowRight',13)}</button></div>${inc.length?inc.slice(0,4).map(i=>`<div class="list-incident" data-action="incident" data-id="${i.id}"><div class="incident-mark">${ic('alert',16)}</div><div class="incident-copy"><div class="incident-title">${escapeHtml(i.title)}</div><div class="incident-desc">${statusTag(i.status)} ${levelTag(i.level)} <span>${timeAgo(i.lastSeen)}</span><span>× ${i.count}</span></div></div>${ic('right',15)}</div>`).join(''):empty('No incidents','No incidents match this environment.')}</div></div><div class="panel"><div class="panel-head"><div><h2>Latest logs</h2><p>Most recent events from this application</p></div><div style="display:flex;gap:11px;align-items:center"><span class="tag ${state.live?'green':'muted'}"><span class="dot ${state.live?'pulse':''}"></span>${state.live?'Live simulation':'Paused'}</span><button class="btn btn-sm btn-ghost" data-action="nav" data-page="logs">Open explorer ${ic('arrowRight',13)}</button></div></div>${renderLogTable(ls.slice(0,6),false)}</div>`;
    }
    function renderLogTable(items,withActions){if(!items.length)return empty('No logs match your filters','Try another search, environment or time range.');return `<div class="table-scroll"><table><thead><tr><th>Time</th><th>Level</th><th>Message</th><th>Service</th><th>Host</th>${withActions?'<th></th>':''}</tr></thead><tbody>${items.map(l=>`<tr class="click-row" data-action="log" data-id="${l.id}"><td class="mono muted">${fmtTime(l.timestamp)}</td><td>${levelTag(l.level)}</td><td><div class="table-msg strong">${escapeHtml(l.message)}</div></td><td class="muted">${escapeHtml(l.service)}</td><td class="mono dim">${escapeHtml(l.host)}</td>${withActions?`<td>${ic('right',14)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;}
    function renderLogs(){let rows=currentLogs().filter(l=>(state.logLevel==='ALL'||l.level===state.logLevel)&&(!state.logQuery||`${l.message} ${l.traceId} ${l.host}`.toLowerCase().includes(state.logQuery.toLowerCase()))).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));const pages=Math.ceil(rows.length/12)||1;state.logPage=Math.min(state.logPage,pages-1);
      return `<div class="page-heading"><div><div class="eyebrow">Explore your events</div><h1>Logs Explorer</h1><p class="subtitle">Search application logs, inspect trace metadata and follow the live stream.</p></div><div class="heading-actions"><button class="btn ${state.live?'btn-primary':''}" data-action="toggle-live"><span class="dot ${state.live?'pulse':''}"></span>${state.live?'Live streaming':'Live paused'}</button><button class="btn" data-action="simulate">${ic('bolt',15)} Simulate log</button></div></div><div class="panel"><div class="toolbar"><div class="search-wrap">${ic('search',16)}<input id="log-search" class="field" placeholder="Search message, trace ID or host..." value="${escapeHtml(state.logQuery)}" data-search="logs"/></div><select class="field" id="log-level"><option value="ALL">All levels</option>${['INFO','WARN','ERROR','CRITICAL'].map(x=>`<option ${state.logLevel===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" data-action="clear-logs">${ic('refresh',14)} Reset filters</button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 18px;border-bottom:1px solid #29313a"><div class="pill-stat"><span class="dot" style="background:${state.live?'#44d8ac':'#87919c'}"></span><span>${state.live?'Simulated stream active':'Stream paused'}</span><span class="dim" style="margin-left:5px">·</span><strong>${rows.length}</strong><span>matching events</span></div><span class="tiny-note">Click any row to inspect the full log</span></div>${renderLogTable(rows.slice(state.logPage*12,state.logPage*12+12),true)}<div class="table-footer"><span>Showing ${rows.length?state.logPage*12+1:0}–${Math.min(rows.length,(state.logPage+1)*12)} of ${rows.length} logs</span><div style="display:flex;gap:8px"><button class="btn btn-sm" data-action="log-prev" ${!state.logPage?'disabled':''}>${ic('left',13)} Previous</button><button class="btn btn-sm" data-action="log-next" ${state.logPage>=pages-1?'disabled':''}>Next ${ic('right',13)}</button></div></div></div><p class="tiny-note" style="margin-top:12px">This preview uses mock events. A production client would combine REST search with authenticated, reconnecting SSE for new logs.</p>`;
    }
    function renderIncidents(){let list=currentIncidents().filter(i=>(state.incidentStatus==='ALL'||i.status===state.incidentStatus)&&(state.incidentLevel==='ALL'||i.level===state.incidentLevel)&&(!state.incidentQuery||i.title.toLowerCase().includes(state.incidentQuery.toLowerCase()))).sort((a,b)=>b.lastSeen.localeCompare(a.lastSeen));const all=currentIncidents();
      return `<div class="page-heading"><div><div class="eyebrow">Issue management</div><h1>Incidents</h1><p class="subtitle">Review, investigate and resolve incidents for your assigned application.</p></div><div class="heading-actions"><span class="tag muted">${ic('shield',13)} Engineer access</span></div></div><div class="kpi-grid">${kpi('Open incidents',all.filter(i=>i.status==='OPEN').length,'alert','Needs investigation','#ffa5a9')}${kpi('Resolved incidents',all.filter(i=>i.status==='RESOLVED').length,'circleCheck','Automatically or manually')}${kpi('Error incidents',all.filter(i=>i.level==='ERROR').length,'logs','In current environment')}${kpi('Critical incidents',all.filter(i=>i.level==='CRITICAL').length,'bolt','Higher priority')}</div><div class="panel"><div class="tabs">${[['ALL','All incidents'],['OPEN','Open'],['RESOLVED','Resolved']].map(([s,label])=>`<button class="tab ${state.incidentStatus===s?'active':''}" data-action="incident-status" data-status="${s}">${label}</button>`).join('')}</div><div class="toolbar"><div class="search-wrap">${ic('search',15)}<input class="field" id="incident-search" data-search="incidents" placeholder="Search incidents..." value="${escapeHtml(state.incidentQuery)}"/></div><select class="field" id="incident-level"><option value="ALL">All levels</option><option ${state.incidentLevel==='ERROR'?'selected':''}>ERROR</option><option ${state.incidentLevel==='CRITICAL'?'selected':''}>CRITICAL</option></select></div>${list.length?`<div class="table-scroll"><table><thead><tr><th>Incident</th><th>Status</th><th>Severity</th><th>Count</th><th>Environment</th><th>Last seen</th><th></th></tr></thead><tbody>${list.map(i=>`<tr class="click-row" data-action="incident" data-id="${i.id}"><td><div class="strong ellipsis" style="max-width:370px">${escapeHtml(i.title)}</div><div class="mono dim" style="margin-top:5px">${escapeHtml(i.fingerprint)}</div></td><td>${statusTag(i.status)}</td><td>${levelTag(i.level)}</td><td class="strong">${i.count}</td><td><span class="tag muted">${i.env}</span></td><td class="muted">${timeAgo(i.lastSeen)}</td><td>${ic('right',14)}</td></tr>`).join('')}</tbody></table></div>`:empty('No incidents found','Try resetting the status, severity or search filters.')}<div class="table-footer"><span>${list.length} incident${list.length!==1?'s':''} in this view</span><span>Click an incident to view lifecycle history</span></div></div>`;
    }
    function renderAnalytics(){const distribution=[['INFO',73.4,'#54d2aa'],['WARN',19.1,'#edb05f'],['ERROR',6.8,'#f17682'],['CRITICAL',.7,'#b980dd']];const hourly=Array.from({length:24},(_,i)=>({hour:i,info:21+(i*17)%34+Math.round((Math.sin(i/3)+1)*12),warn:5+(i*11)%15,error:2+(i*3)%9}));let max=110;
      return `<div class="page-heading"><div><div class="eyebrow">Trends and insights</div><h1>Analytics</h1><p class="subtitle">Understand log volume and severity trends by hour.</p></div><div class="heading-actions"><span class="tag muted">${ic('clock',13)} Hourly aggregates</span><button class="btn" data-action="simulate">${ic('refresh',15)} Add demo event</button></div></div><div class="kpi-grid">${kpi('Total log volume','12,486','logs','Within selected time range')}${kpi('Error events','248','alert','1.99% of all logs')}${kpi('Critical events','16','bolt','0.13% of all logs')}${kpi('Error rate','2.12%','chart','ERROR + CRITICAL / total')}</div><div class="panel" style="margin-bottom:18px"><div class="panel-head"><div><h2>Log volume over time</h2><p>Severity breakdown · 24 hourly buckets (sample data)</p></div><span class="tag muted">24 hours</span></div><div style="padding:20px 25px"><div class="chart-legend"><span><span class="legend-marker" style="background:#51d4a8"></span>INFO</span><span><span class="legend-marker" style="background:#efba75"></span>WARN</span><span><span class="legend-marker" style="background:#ed7f8a"></span>ERROR</span></div><div class="bar-grid">${hourly.map(h=>`<div class="bar-stack" title="${String(h.hour).padStart(2,'0')}:00 · INFO ${h.info} · WARN ${h.warn} · ERROR ${h.error}"><div class="barpart" style="background:#ed7f8a;height:${h.error/max*100}%"></div><div class="barpart" style="background:#efb66d;height:${h.warn/max*100}%"></div><div class="barpart" style="background:#3cbe99;height:${h.info/max*100}%"></div></div>`).join('')}</div><div class="bar-labels"><span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>23:00</span></div></div></div><div class="split-grid"><div class="panel"><div class="panel-head"><div><h2>Log level distribution</h2><p>Severity as a percentage of all logs</p></div></div><div style="padding:21px">${distribution.map(([level,perc,color])=>`<div style="display:grid;grid-template-columns:75px 1fr 52px;gap:15px;align-items:center;margin:14px 0"><span class="level ${level}">${level}</span><div class="track"><span style="width:${perc}%;background:${color}"></span></div><strong style="font-size:12px;text-align:right">${perc}%</strong></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h2>Environment breakdown</h2><p>Aggregated activity by environment</p></div></div>${[['DEV',78],['TEST',16],['STAGING',6]].map(([name,perc])=>`<div class="env-row"><span class="env-name">${name}</span><div class="track"><span style="width:${perc}%"></span></div><span class="env-number">${perc}%</span></div>`).join('')}<div class="tiny-note" style="padding:17px 20px">Analytics values are illustrative; real VaniOAK uses hourly aggregated data.</div></div></div>`;
    }
    function renderDetail(id){const i=incidents.find(x=>x.id===id);if(!i||i.appId!==state.appId)return `<div class="page-heading"><h1>Incident not found</h1></div><button class="btn" data-action="nav" data-page="incidents">Back to incidents</button>`;
      return `<div style="margin-bottom:20px"><button class="btn btn-ghost" data-action="nav" data-page="incidents">${ic('left',16)} Back to incidents</button></div><div class="page-heading"><div><div class="eyebrow">Incident investigation</div><h1 style="max-width:790px;line-height:1.28">${escapeHtml(i.title)}</h1><div style="display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap">${statusTag(i.status)}<span class="tag ${i.level==='CRITICAL'?'red':'orange'}">${i.level}</span><span class="tag muted">${i.env}</span><span class="mono dim">${i.fingerprint}</span></div></div><div class="heading-actions">${i.status==='OPEN'?`<button class="btn btn-primary" data-action="resolve" data-id="${i.id}">${ic('circleCheck',17)} Resolve incident</button>`:`<span class="tag green">${ic('circleCheck',14)} Resolved</span>`}</div></div><div class="kpi-grid">${kpi('Current status',i.status,'circleCheck','Incident lifecycle')}${kpi('Occurrences',i.count,'logs','Matching log events')}${kpi('First seen',fmtTime(i.firstSeen),'clock','Initial detection')}${kpi('Last seen',fmtTime(i.lastSeen),'clock','Latest matching event')}</div><div class="detail-grid"><div class="panel"><div class="panel-head"><div><h2>Incident information</h2><p>Diagnostic details for investigation</p></div></div>${[['Application',app().name],['Environment',i.env],['Severity',i.level],['Fingerprint',i.fingerprint],['First seen',fmtTime(i.firstSeen,true)],['Last seen',fmtTime(i.lastSeen,true)],['Resolved at',i.resolvedAt?fmtTime(i.resolvedAt,true):'—'],['Resolution source',i.resolutionSource||'—'],['Resolved by',i.resolvedBy||'—']].map(([k,v])=>`<div class="detail-row"><div class="detail-label">${k}</div><div class="detail-val ${['Fingerprint'].includes(k)?'mono':''}">${escapeHtml(v)}</div></div>`).join('')}<div style="padding:19px"><h3 style="margin-bottom:10px">Investigate related logs</h3><p class="subtitle">Use Logs Explorer to search messages and trace IDs from this incident.</p><button class="btn" data-action="incident-to-logs" data-id="${i.id}" style="margin-top:14px">${ic('search',15)} Explore logs ${ic('arrowRight',14)}</button></div></div><div class="panel"><div class="panel-head"><div><h2>Activity timeline</h2><p>Recorded incident lifecycle history</p></div></div><div style="padding:22px 23px">${[...i.history].reverse().map(ev=>`<div class="timeline-item"><div class="timeline-event">${ev.kind==='OPENED'?'Incident opened':ev.kind==='COUNT_UPDATED'?'Occurrence count updated':'Incident resolved'}</div><div class="timeline-time">${fmtTime(ev.at,true)} · ${timeAgo(ev.at)}</div><div class="timeline-note">${escapeHtml(ev.note)}</div></div>`).join('')}</div><div class="divider"></div><div style="padding:17px 20px"><span class="tag muted">${ic('shield',13)} Engineer permissions</span><p class="tiny-note" style="margin:11px 0 0">You can resolve incidents assigned to your application. This preview updates demo data locally and does not call the backend.</p></div></div></div>`;
    }
    function renderDrawer(id){const l=logs.find(x=>x.id===id);if(!l)return '';const payload=JSON.stringify({application_name:l.appId,environment:l.env,host_ip:l.host,log_level:l.level,message:l.message,timestamp:l.timestamp,trace_id:l.traceId,service:l.service,span_id:l.span,request_id:l.request},null,2);
      return `<div class="drawer-layer"><div class="drawer-scrim" data-action="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Log details"><div class="drawer-header"><div><div class="eyebrow">Event inspector</div><h2 style="font-size:18px">Log details</h2></div><button class="btn btn-sm" data-action="close-drawer">${ic('close',16)}</button></div><div class="drawer-body"><div style="display:flex;gap:9px;align-items:center;margin-bottom:17px">${levelTag(l.level)}<span class="tag muted">${l.env}</span><span class="muted">${timeAgo(l.timestamp)}</span></div><div style="font-size:15px;line-height:1.6;font-weight:640;overflow-wrap:anywhere">${escapeHtml(l.message)}</div><div class="drawer-section">Event metadata</div><div class="panel">${[['Timestamp',fmtTime(l.timestamp,true)],['Application',l.appId],['Environment',l.env],['Host IP',l.host],['Service',l.service],['Trace ID',l.traceId],['Span ID',l.span],['Request ID',l.request]].map(([k,v])=>`<div class="detail-row" style="grid-template-columns:105px 1fr;padding:12px"><div class="detail-label">${k}</div><div class="detail-val mono">${escapeHtml(v)}</div></div>`).join('')}</div><div class="drawer-section">Structured event</div><div class="code-panel">${escapeHtml(payload)}</div><button class="btn" style="margin-top:16px" data-action="copy-trace" data-id="${l.id}">${ic('copy',14)} Copy trace ID</button></div></aside></div>`;
    }
    function renderModal(id){const i=incidents.find(x=>x.id===id);if(!i)return '';return `<div class="modal-layer"><div class="modal-scrim" data-action="close-modal"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Resolve incident"><div class="tag green" style="margin-bottom:20px">${ic('circleCheck',13)} Manual resolution</div><h2 style="font-size:21px">Resolve this incident?</h2><p>Mark <strong style="color:#eaf2f6">${escapeHtml(i.title)}</strong> as resolved. This demo will record a manual resolution in the local UI only.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-resolve" data-id="${id}">${ic('check',14)} Confirm resolve</button></div></div></div>`;}
    function render(){let path=(location.hash||'#/login').slice(1).split('?')[0]; if(path==='/'||!path)path='/login';if(!state.auth&&!['/login'].includes(path)){location.hash='#/login';path='/login';}if(state.auth&&path==='/login'){location.hash='#/applications';path='/applications';}
      let html='';if(path==='/login')html=renderLogin();else if(path==='/applications')html=renderApps();else{let m=path.match(/^\/applications\/([^/]+)\/(overview|logs|incidents|analytics)(?:\/([^/]+))?$/);if(!m){location.hash='#/applications';html=renderApps();}else{state.appId=apps.some(a=>a.id===m[1])?m[1]:apps[0].id;const page=(m[2]==='incidents'&&m[3])?'detail':m[2];html=workspaceHeader(page)+(page==='overview'?renderOverview():page==='logs'?renderLogs():page==='incidents'?renderIncidents():page==='analytics'?renderAnalytics():renderDetail(m[3]))+'</main></section></div>';}}
      if(state.drawerId)html+=renderDrawer(state.drawerId);if(state.modalId)html+=renderModal(state.modalId);if(state.toast)html+=`<div class="toast">${ic('circleCheck',17)} ${escapeHtml(state.toast)}</div>`;el().innerHTML=html;
    }
    function toast(msg){state.toast=msg;render();clearTimeout(toast.timer);toast.timer=setTimeout(()=>{state.toast=null;render();},2700);}
    function preserveSearch(type){const ids={apps:'app-search',logs:'log-search',incidents:'incident-search'};const node=document.getElementById(ids[type]);const a=node?node.selectionStart:0;render();const next=document.getElementById(ids[type]);if(next){next.focus();try{next.setSelectionRange(a,a);}catch(e){}}}
    document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();state.auth=true;go('/applications');}});
    document.addEventListener('input',e=>{const search=e.target.dataset.search;if(!search)return;if(search==='apps')state.appQuery=e.target.value;else if(search==='logs'){state.logQuery=e.target.value;state.logPage=0;}else if(search==='incidents')state.incidentQuery=e.target.value;preserveSearch(search);});
    document.addEventListener('change',e=>{if(e.target.id==='env-select'){state.env=e.target.value;state.logPage=0;render();}else if(e.target.id==='time-select'){state.time=e.target.value;state.logPage=0;render();}else if(e.target.id==='log-level'){state.logLevel=e.target.value;state.logPage=0;render();}else if(e.target.id==='incident-level'){state.incidentLevel=e.target.value;render();}});
    document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;
      if(action==='apps')go('/applications');
      else if(action==='logout'){state.auth=false;state.drawerId=null;state.modalId=null;go('/login');}
      else if(action==='select-app'){state.appId=id;state.env='DEV';state.logQuery='';state.logPage=0;go(appHash());}
      else if(action==='nav')go(appHash(target.dataset.page));
      else if(action==='incident')go(appHash('incidents/'+id));
      else if(action==='log'){state.drawerId=id;render();}
      else if(action==='close-drawer'){state.drawerId=null;render();}
      else if(action==='copy-trace'){const l=logs.find(x=>x.id===id);if(l&&navigator.clipboard?.writeText){navigator.clipboard.writeText(l.traceId).then(()=>toast('Trace ID copied to clipboard')).catch(()=>toast('Clipboard access is unavailable'));}else toast('Trace ID: '+(l?l.traceId:''));}
      else if(action==='toggle-live'){state.live=!state.live;render();}
      else if(action==='simulate'){const idx=logs.length+1;const level=['ERROR','INFO','WARN'][idx%3];logs.unshift({id:'new-'+idx,level,message:level==='ERROR'?'Gateway request timed out during capture':level==='INFO'?'POST /api/v1/payments 200 (108ms)':'Slow provider response detected',appId:state.appId,env:state.env==='ALL'?'DEV':state.env,timestamp:new Date().toISOString(),traceId:'demo-67d3-'+idx,host:'10.20.20.24',service:state.appId,span:'01002def0f12a56c',request:'req_demo_'+idx});toast('New simulated '+level+' log added');}
      else if(action==='log-prev'){state.logPage=Math.max(0,state.logPage-1);render();}
      else if(action==='log-next'){state.logPage++;render();}
      else if(action==='clear-logs'){state.logQuery='';state.logLevel='ALL';state.logPage=0;render();}
      else if(action==='incident-status'){state.incidentStatus=target.dataset.status;render();}
      else if(action==='resolve'){state.modalId=id;render();}
      else if(action==='close-modal'){state.modalId=null;render();}
      else if(action==='confirm-resolve'){const i=incidents.find(x=>x.id===id);if(i&&i.status==='OPEN'){i.status='RESOLVED';i.resolvedAt=new Date().toISOString();i.resolutionSource='MANUAL';i.resolvedBy='Alex Morgan (Engineer)';i.history.push({kind:'RESOLVED',at:i.resolvedAt,note:'Manually resolved by Alex Morgan'});}state.modalId=null;toast('Incident resolved successfully (demo)');}
      else if(action==='incident-to-logs'){const i=incidents.find(x=>x.id===id);state.logQuery=i?i.title.split(' ').slice(0,3).join(' '):'';state.logPage=0;go(appHash('logs'));}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modalId)state.modalId=null;else if(state.drawerId)state.drawerId=null;else return;render();}});
    window.addEventListener('hashchange',render);
    if(!location.hash)location.hash='#/login';render();
  })();
  </script>
</body>
</html>
