<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>VaniOAK — Admin UI Prototype v1.0</title>
<style>

    :root { --bg:#0d1015; --surface:#12161c; --surface2:#171c23; --surface3:#1d232b; --panel:#131820; --stroke:#29313b; --stroke2:#323a46; --text:#e9edf2; --muted:#939da9; --faint:#697482; --green:#36d6ad; --green-dark:#183a33; --red:#f57983; --red-dark:#3b2329; --orange:#ffb45f; --blue:#76a9ff; --shadow:0 20px 60px #0008; --radius:10px; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:13px; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; } button { cursor:pointer; } button:disabled { opacity:.44;cursor:not-allowed; }
    input,select { outline:0; }
    a { color:inherit;text-decoration:none; }

    .app-shell { display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh; }

    .app-switch:hover{border-color:#65756f;} .app-icon { display:grid;place-items:center;height:31px;width:31px;border-radius:8px;background:#22443b;color:#6ee7c6;flex-shrink:0; }

    .account-meta { flex:1;min-width:0; } .account-name { font-weight:630; } .account-role {color:var(--muted);font-size:11px;margin-top:2px;}

    .top-icon { display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--stroke2);border-radius:7px;background:#171c22;color:#b3beca; }

    .btn:hover{background:#242c36;border-color:#4a5967;} .btn-primary {background:#2ebd98;border-color:#2ebd98;color:#06251c;} .btn-primary:hover {background:#58dcb7;border-color:#58dcb7;} .btn-danger{background:#57292f;border-color:#87434c;color:#ffc1c6;} .btn-danger:hover{background:#70343c;} .btn-ghost{background:transparent;border-color:transparent;}.btn-ghost:hover{background:#1d242d;border-color:#1d242d;}

    .panel-head {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--stroke);} .panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px;}

    .tag.green {background:#163b31;border-color:#236f57;color:#68e1b6;} .tag.red {background:#40242c;border-color:#6a313d;color:#ff939c;} .tag.orange {background:#3b2b1b;border-color:#665033;color:#f1bd75;} .tag.blue{background:#1c3047;border-color:#355b7d;color:#93c5ff;} .tag.muted{background:#242a32;border-color:#363f49;color:#b6c0cb;} .tag.cyan{background:#183741;border-color:#2e6370;color:#7bcfdb;}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:19px;} .kpi {padding:19px 20px;background:var(--surface);border:1px solid var(--stroke);border-radius:9px;} .kpi-title{font-size:12px;color:#a4afbb;display:flex;justify-content:space-between;align-items:center;} .kpi-title .icon{color:#798590;} .kpi-val{font-size:30px;font-weight:725;letter-spacing:-1.1px;margin-top:14px;line-height:1;} .kpi-sub{margin-top:12px;font-size:11px;color:#818e9b;} .kpi-up{color:#61d2a7;} .kpi-warn{color:#feb975;}
    .split-grid{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(290px,.95fr);gap:18px;margin-bottom:19px;} .chart-body{padding:10px 20px 17px;} .chart-legend{display:flex;align-items:center;gap:18px;color:#9ba7b4;font-size:11px;padding:0 0 9px;} .legend-marker{display:inline-block;height:8px;width:8px;border-radius:50%;margin-right:6px;} .chart-svg{width:100%;height:213px;display:block;} .chart-grid{stroke:#29333c;stroke-width:1;stroke-dasharray:4 5;} .chart-label{fill:#82909c;font-size:11px;} .bar-grid{display:flex;align-items:flex-end;gap:8px;height:200px;padding:15px 4px 0;border-bottom:1px solid #38404b;} .bar-stack{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;} .bar-stack .barpart{border-radius:3px 3px 0 0;min-height:3px;} .bar-labels{display:flex;justify-content:space-between;color:#83909e;padding-top:11px;font-size:10px;}
    .env-row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #252d36;} .env-row:last-child{border-bottom:0;} .env-name{min-width:80px;font-weight:590;} .track{height:8px;border-radius:10px;background:#27313a;flex:1;overflow:hidden;} .track > span{height:100%;display:block;background:linear-gradient(90deg,#249b80,#58dbb6);border-radius:10px;} .env-number{font-variant-numeric:tabular-nums;min-width:60px;text-align:right;color:#c1cbd5;}
    .table-scroll{overflow:auto;max-width:100%;} table{width:100%;border-collapse:collapse;text-align:left;} th{font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:720;color:#7e8b99;padding:13px 17px;background:#161b21;border-bottom:1px solid #2a323b;white-space:nowrap;} td{padding:14px 17px;border-bottom:1px solid #252c35;color:#cbd4dd;font-size:12px;white-space:nowrap;} tr:last-child td{border-bottom:0;} tbody tr.click-row{cursor:pointer;} tbody tr.click-row:hover{background:#1c242b;} .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;letter-spacing:-.2px;} .muted{color:var(--muted);} .dim{color:var(--faint);} .strong{font-weight:650;color:#eaf1f5;} .ellipsis{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .table-msg{min-width:300px;max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .level {font-weight:720;letter-spacing:.45px;font-size:10px;} .level.ERROR{color:#ff8b95;}.level.CRITICAL{color:#ff616e;}.level.WARN{color:#ffc078;}.level.INFO{color:#6ddec0;}

    .light-separator{height:1px;background:#29323c;margin:18px 0;} .inline-link{color:#72dfbf;cursor:pointer;font-weight:600;} .inline-link:hover{text-decoration:underline;}

    .intro-banner{background:linear-gradient(110deg,#14261f,#142322 55%,#1a272a);border:1px solid #285342;border-radius:10px;padding:19px 22px;margin-bottom:19px;display:flex;align-items:center;justify-content:space-between;gap:12px;} .intro-banner h3{font-size:14px;margin:0 0 5px;color:#d5fbec;} .intro-banner p{color:#9fb9b0;margin:0;font-size:12px;line-height:1.55;}
    .tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--stroke);padding:0 18px;} .tab{padding:13px 15px;background:none;border:none;border-bottom:2px solid transparent;color:#9aa7b4;font-weight:590;}.tab.active{color:#6ce7be;border-color:#3acda4;} .tab:hover{color:#e5edf2;}
    .apps-page {min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#172923 0,transparent 50%),#0d1115;}.apps-top{height:72px;border-bottom:1px solid #2a323a;display:flex;justify-content:space-between;align-items:center;padding:0 max(28px,calc((100vw - 1110px)/2));}.apps-top .brand{border:0;padding:0;height:auto;}.apps-container{max-width:1110px;padding:60px 28px;margin:auto;}.apps-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px;}.app-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;}.app-card{background:#151a20;border:1px solid #303944;border-radius:10px;padding:22px;text-align:left;color:inherit;min-height:202px;display:flex;flex-direction:column;gap:13px;transition:transform .15s,border-color .15s;}.app-card:hover{border-color:#4da78d;transform:translateY(-2px);}.app-card-top{display:flex;align-items:center;justify-content:space-between;}.app-card-name{font-size:16px;font-weight:720;letter-spacing:-.2px;margin-top:2px;}.app-card-description{color:#9ca8b2;font-size:12px;line-height:1.6;min-height:40px;}.app-card-footer{border-top:1px solid #303842;padding-top:13px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#9aa7b2;font-size:11px;}.apps-info{display:flex;gap:10px;color:#a2b0ba;font-size:12px;margin-top:31px;align-items:center;}
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#0d1217;} .login-art{position:relative;padding:54px 7vw;background:radial-gradient(ellipse at 15% 30%,#143c32 0%,transparent 44%),linear-gradient(140deg,#0e171a,#0c1517);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #2a383a;}.login-art .brand{border:0;padding:0;height:auto;}.login-art-content{z-index:2;margin:auto 0;max-width:570px;}.login-art h1{font-size:49px;line-height:1.1;letter-spacing:-2.5px;margin:0 0 22px;}.login-art p{max-width:440px;color:#9fb7b0;font-size:15px;line-height:1.75;}.login-visual{position:relative;height:160px;margin-top:44px;border:1px solid #346051;border-radius:12px;background:#101f1bba;box-shadow:0 10px 50px #0005;overflow:hidden;padding:20px;}.login-visual .minibar{height:5px;border-radius:3px;margin:10px 0;background:#235347;}.login-visual .minibar:nth-child(2){width:77%;background:#34685a;}.login-visual .minibar:nth-child(3){width:65%;background:#2a564c;}.login-visual .minibar:nth-child(4){width:90%;background:#4b3a3a;}.login-visual .minibar:nth-child(5){width:54%;background:#235347;}.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:35px;}.login-form{width:100%;max-width:400px;}.login-form h2{font-size:27px;margin-bottom:8px;letter-spacing:-.8px;}.login-form p{color:#9aa6b3;margin-bottom:32px;line-height:1.6;}.form-label{display:block;color:#cad3db;font-size:12px;font-weight:620;margin:19px 0 9px;}.login-form .field{width:100%;height:43px;}.login-form .btn{height:44px;margin-top:21px;}.form-hint{padding:15px;border:1px solid #345047;background:#16271f;color:#a6d2c2;border-radius:8px;line-height:1.6;font-size:12px;margin-top:26px;}.form-hint strong{color:#b5f3d8;}

    function adminShell(page,section='manage'){

':''} value="${e}">${e==='ALL'?'All environments':e}</option>`).join('')}</select></label><label class="select-wrap">${ic('calendar',14)}<select id="time-select" aria-label="Time range"><option value="1h" ${state.time==='1h'?'selected':''}>Last hour</option><option value="24h" ${state.time==='24h'?'selected':''}>Last 24 hours</option><option value="7d" ${state.time==='7d'?'selected':''}>Last 7 days</option></select></label>`:''}<button class="top-icon" title="Applications" data-action="apps">${ic('grid',17)}</button></div></header><main class="main">`;
    }

t':''}">${ic(a.icon,18)}</span><span><strong>${escapeHtml(a.name)}</strong><small>${escapeHtml(a.desc)}</small></span></div></td><td>${tags(a.status)}</td><td><div style="display:flex;gap:5px">${Object.entries(environments[a.id]||{}).filter(([,on])=>on).map(([env])=>`<span class="tag muted">${env}</span>`).join('')||'—'}</div></td><td><span class="mono">${users.filter(u=>u.role==='ENGINEER'&&u.apps.includes(a.id)).length}</span> <span class="muted">assigned</span></td><td>${escapeHtml(a.owner)}</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="select-app" data-id="${a.id}">Open ${ic('arrowRight',13)}</button><button class="btn btn-sm btn-ghost" data-action="app-settings" data-id="${a.id}" title="Settings">${ic('settings',15)}</button></div></td></tr>`).join('')||`<tr><td colspan="6">${empty('No matching applications','Try a different filter or create your first application.')}</td></tr>`}</tbody></table></div><div class="table-footer"><span>Showing ${filtered.length} of ${apps.length} applications</span><span>Changes are simulated in this preview</span></div></div>`;

    function renderAdminUsers(){

name)}</strong><small>${escapeHtml(u.email)}</small></span></div></td><td><span class="tag ${u.role==='ADMIN'?'blue':'muted'}">${ic(u.role==='ADMIN'?'shield':'layers',12)} ${u.role}</span></td><td>${tags(u.status)}</td><td>${u.role==='ADMIN'?'<span class="muted">All applications</span>':`<span class="mono">${u.apps.length}</span> <span class="muted">assigned</span>`}</td><td class="muted">${u.last}</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="open-modal" data-kind="user-edit" data-id="${u.id}">Edit</button><button class="btn btn-sm btn-ghost" title="Toggle account status" data-action="open-modal" data-kind="user-toggle" data-id="${u.id}">${ic('settings',14)}</button></div></td></tr>`).join('')||`<tr><td colspan="6">${empty('No users found','Try clearing your search or role filter.')}</td></tr>`}</tbody></table></div><div class="table-footer"><span>${results.length} members shown</span><span>Admin has organization-wide visibility</span></div></div><div class="hint-panel" style="margin-top:18px">${ic('info',16)} <span>Engineer access is scoped per application. Assign or remove engineers from the <strong>Engineers</strong> tab in Application Settings.</span></div>`;
    }
    function settingNav(){return `<div class="settings-tabs" role="tablist" aria-label="Application settings">${[['general','General'],['environments','Environments'],['engineers','Engineers'],['keys','API Keys'],['rules','Alert Rules']].map(([id,l])=>`<button role="tab" aria-selected="${state.adminTab===id}" class="${state.adminTab===id?'selected':''}" data-action="settings-tab" data-id="${id}">${l}${id==='engineers'?`<span class="tab-badge">${users.filter(u=>u.role==='ENGINEER'&&u.apps.includes(state.appId)).length}</span>`:''}</button>`).join('')}</div>`;}
    function renderSettings(){return `${topTitle('Application / Configuration','Application Settings',`Manage access, ingestion credentials and alerting for ${escapeHtml(app().name)}.`,`<button class="btn" data-action="nav" data-page="overview">${ic('grid',14)} View workspace</button>`)}${settingNav()}<section class="settings-surface">${({general:renderGeneral,environments:renderEnvironments,engineers:renderEngineers,keys:renderKeys,rules:renderRules}[state.adminTab]||renderGeneral)()}</section>`;}
    function renderGeneral(){return `<div class="settings-lead"><div><h2>General settings</h2><p>Identity and status of this application.</p></div><button class="btn" data-action="open-modal" data-kind="app-edit" data-id="${app().id}">${ic('settings',14)} Edit details</button></div><div class="settings-details"><div class="field-card"><small>Application name</small><strong class="mono">${escapeHtml(app().name)}</strong></div><div class="field-card"><small>Application ID</small><strong class="mono">app_${escapeHtml(app().id.replace(/-/g,'_'))}</strong></div><div class="field-card"><small>Owner</small><strong>${escapeHtml(app().owner)}</strong></div><div class="field-card"><small>Current status</small>${tags(app().status)}</div><div class="field-card"><small>Description</small><strong>${escapeHtml(app().desc)}</strong></div><div class="field-card"><small>Default environments</small><strong>DEV · TEST · STAGING</strong></div></div><div class="subhead">Application lifecycle</div><div class="hint-panel warning">${ic('info',17)}<span>Disabling an application affects ingestion eligibility in this prototype. It does not delete historical logs or incidents.</span></div><button class="btn ${app().status==='ACTIVE'?'btn-danger':''}" style="margin-top:15px" data-action="open-modal" data-kind="app-toggle" data-id="${app().id}">${app().status==='ACTIVE'?'Disable application':'Enable application'}</button>`;}
    function renderEnvironments(){return `<div class="settings-lead"><div><h2>Environments</h2><p>Three fixed environment types are configured for every application.</p></div><span class="tag muted">3 environments</span></div><div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>Environment</th><th>Purpose</th><th>Status</th><th>API key</th><th style="text-align:right">Actions</th></tr></thead><tbody>${[['DEV','Development and internal testing'],['TEST','QA and integration checks'],['STAGING','Pre-production validation']].map(([e,desc])=>`<tr><td><div class="entity-cell"><span class="round-icon ${e==='TEST'?'blue':e==='STAGING'?'orange':''}">${ic('server',17)}</span><span><strong>${e}</strong><small>${desc}</small></span></div></td><td class="muted">${desc}</td><td>${tags(environments[state.appId]?.[e]?'ACTIVE':'DISABLED')}</td><td>${keys.filter(k=>k.appId===state.appId&&k.env===e&&k.status==='ACTIVE').length} active</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="open-modal" data-kind="env-toggle" data-id="${e}">${environments[state.appId]?.[e]?'Disable':'Enable'}</button><button class="btn btn-sm btn-ghost" data-action="env-keys" data-id="${e}">API Keys ${ic('arrowRight',13)}</button></div></td></tr>`).join('')}</tbody></table></div></div><div class="hint-panel" style="margin-top:17px">${ic('info',16)}<span>Environment codes are fixed in the MVP. Disabling an environment does not remove historical observability data. API keys are managed separately.</span></div>`;}
    function renderEngineers(){const assigned=users.filter(u=>u.role==='ENGINEER'&&u.apps.includes(state.appId));return `<div class="settings-lead"><div><h2>Assigned engineers</h2><p>Only assigned engineers can view this application's logs and incidents.</p></div><button class="btn btn-primary" data-action="open-modal" data-kind="assign">${ic('arrowRight',14)} Assign engineer</button></div><div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>Engineer</th><th>Account status</th><th>Permission</th><th style="text-align:right">Actions</th></tr></thead><tbody>${assigned.map(u=>`<tr><td><div class="entity-cell"><span class="user-avatar">${u.initials}</span><span><strong>${escapeHtml(u.name)}</strong><small>${escapeHtml(u.email)}</small></span></div></td><td>${tags(u.status)}</td><td class="muted">Logs · Analytics · Incidents · Resolve</td><td><div class="inline-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-kind="unassign" data-id="${u.id}">Remove access</button></div></td></tr>`).join('')||`<tr><td colspan="4">${empty('No assigned engineers','Assign an engineer to grant application visibility.')}</td></tr>`}</tbody></table></div></div><div class="hint-panel" style="margin-top:17px">${ic('shield',16)}<span>Application assignment controls engineer access across DEV, TEST and STAGING. Administrators retain organization-wide management rights.</span></div>`;}
    function renderKeys(){const list=keys.filter(k=>k.appId===state.appId);return `<div class="settings-lead"><div><h2>API Keys</h2><p>Ingestion credentials are issued for an application and one environment.</p></div><button class="btn btn-primary" data-action="open-modal" data-kind="key-create">${ic('lock',14)} Generate API key</button></div><div class="hint-panel warning" style="margin-bottom:17px">${ic('shield',16)}<span>The full API key is visible <strong>only once</strong> after creation or rotation. This prototype does not persist secret values.</span></div><div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>Key label</th><th>Environment</th><th>Credential</th><th>Status</th><th>Last used</th><th style="text-align:right">Actions</th></tr></thead><tbody>${list.map(k=>`<tr><td><strong>${escapeHtml(k.name)}</strong><div class="muted" style="font-size:11px;margin-top:5px">Created ${k.created}</div></td><td>${envTag(k.env)}</td><td class="mono">${escapeHtml(k.prefix)}••••••••</td><td>${tags(k.status)}</td><td class="muted">${k.used}</td><td><div class="inline-actions">${k.status==='ACTIVE'?`<button class="btn btn-sm" data-action="open-modal" data-kind="key-rotate" data-id="${k.id}">Rotate</button><button class="btn btn-sm btn-ghost" data-action="open-modal" data-kind="key-revoke" data-id="${k.id}">Revoke</button>`:'<span class="muted">Revoked</span>'}</div></td></tr>`).join('')||`<tr><td colspan="6">${empty('No API keys','Generate an API key to send logs from this environment.')}</td></tr>`}</tbody></table></div></div>`;}
    function renderRules(){const list=rules.filter(r=>r.appId===state.appId);return `<div class="settings-lead"><div><h2>Alert Rules</h2><p>Configure threshold-based ERROR and CRITICAL incident detection.</p></div><button class="btn btn-primary" data-action="open-modal" data-kind="rule-create">${ic('arrowRight',14)} New alert rule</button></div><div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>Level / scope</th><th>Trigger</th><th>Cooldown</th><th>Auto-resolve</th><th>Enabled</th><th style="text-align:right">Actions</th></tr></thead><tbody>${list.map(r=>`<tr><td><div style="display:flex;gap:7px;align-items:center">${levelTag(r.level)}${envTag(r.env)}</div></td><td><strong>${r.threshold} events</strong><div class="muted" style="font-size:11px;margin-top:4px">in ${r.window} seconds</div></td><td>${r.cooldown}s</td><td>${r.resolve}s inactivity</td><td>${tags(r.enabled?'ACTIVE':'DISABLED')}</td><td><div class="inline-actions"><button class="btn btn-sm" data-action="open-modal" data-kind="rule-edit" data-id="${r.id}">Edit</button><button class="btn btn-sm btn-ghost" data-action="rule-toggle" data-id="${r.id}">${r.enabled?'Disable':'Enable'}</button></div></td></tr>`).join('')||`<tr><td colspan="6">${empty('No alert rules','Create a threshold rule to start detecting incidents.')}</td></tr>`}</tbody></table></div></div><div class="hint-panel" style="margin-top:17px">${ic('info',16)}<span>Rules detect ERROR/CRITICAL thresholds. The MVP also supports manual or automatic Incident resolution; rule changes here are sample data only.</span></div>`;}
    function formField(label,name,value='',type='text',extra=''){return `<div><label class="form-label" for="fld-${name}">${label}</label><input class="field" type="${type}" id="fld-${name}" name="${name}" value="${escapeHtml(value)}" ${extra}></div>`;}
    function formSelect(label,name,options,chosen){return `<div><label class="form-label" for="fld-${name}">${label}</label><select class="field" id="fld-${name}" name="${name}">${options.map(([v,t])=>`<option value="${escapeHtml(v)}" ${String(chosen)===String(v)?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>`;}
    function closeModal(){state.modal=null;state.secret=null;render();}
    function openModal(kind,id){state.modal={kind,id};render();}
    function makeSecret(){const data=new Uint8Array(18);if(window.crypto?.getRandomValues)crypto.getRandomValues(data);else for(let i=0;i<data.length;i++)data[i]=Math.floor(Math.random()*256);return 'vok_demo_'+Array.from(data,b=>b.toString(16).padStart(2,'0')).join('');}
    function renderAdminModal(){if(!state.modal)return '';const {kind,id}=state.modal;let title='',desc='',body='',footer='',form='';const u=users.find(x=>x.id===id),a=apps.find(x=>x.id===id),k=keys.find(x=>x.id===id),rule=rules.find(x=>x.id===id),i=incidents.find(x=>x.id===id);

      const confirm=(label,red=false)=>`<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn ${red?'btn-danger':'btn-primary'}" data-action="confirm-action">${label}</button></div>`;
      if(kind==='app-create'||kind==='app-edit') {title=kind==='app-create'?'Create application':'Edit application';desc='Applications organize log streams, access and alerting configuration.';form='app-form';body=`<div class="form-grid"><div class="span-all">${formField('Application name','name',a?.name||'','text','required minlength="3" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]*"')}</div><div class="span-all"><label class="form-label" for="fld-description">Description</label><textarea name="description" id="fld-description" placeholder="What does this application do?" required>${escapeHtml(a?.desc||'')}</textarea></div>${formSelect('Application owner','owner',users.filter(x=>x.role==='ADMIN').map(x=>[x.name,x.name]),a?.owner||'Olivia Chen')}</div>${buttons('',''+(a?'Save changes':'Create application'))}`;}
      else if(kind==='app-toggle'){title=(a?.status==='ACTIVE'?'Disable':'Enable')+' application?';desc=a?.status==='ACTIVE'?'Ingestion eligibility will be disabled for this application. Existing logs and incidents remain in place.':'This application will be marked active again.';body=confirm(a?.status==='ACTIVE'?'Disable application':'Enable application',a?.status==='ACTIVE');}
      else if(kind==='user-create'||kind==='user-edit'){title=u?'Edit member':'Create user';desc='Manage organization access. Account changes shown here are simulated.';form='user-form';body=`<div class="form-grid"><div class="span-all">${formField('Full name','name',u?.name||'','text','required minlength="2"')}</div><div class="span-all">${formField('Email address','email',u?.email||'','email','required')}</div>${formSelect('Role','role',[['ENGINEER','Engineer'],['ADMIN','Administrator']],u?.role||'ENGINEER')}${formSelect('Account status','status',[['ACTIVE','Active'],['DISABLED','Disabled']],u?.status||'ACTIVE')}</div>${buttons('',''+(u?'Save changes':'Create user'))}`;}
      else if(kind==='user-toggle'){title=u?.status==='ACTIVE'?'Disable user account?':'Enable user account?';desc=`${escapeHtml(u?.name||'User')} will ${u?.status==='ACTIVE'?'lose':'regain'} access to the organization.`;body=confirm(u?.status==='ACTIVE'?'Disable user':'Enable user',u?.status==='ACTIVE');}
      else if(kind==='env-toggle'){title=`${environments[state.appId]?.[id]?'Disable':'Enable'} ${escapeHtml(id)} environment?`;desc='Existing logs and Incident history remain available. This only changes demonstration environment status.';body=confirm(environments[state.appId]?.[id]?'Disable environment':'Enable environment',!!environments[state.appId]?.[id]);}
      else if(kind==='assign'){title='Assign engineer';desc=`Grant an engineer access to ${escapeHtml(app().name)} in all enabled environments.`;form='assign-form';const avail=users.filter(x=>x.role==='ENGINEER'&&!x.apps.includes(state.appId));body=avail.length?`${formSelect('Engineer','userId',avail.map(x=>[x.id,`${x.name} · ${x.email}${x.status==='DISABLED'?' (disabled)':''}`]),avail[0].id)}${buttons('','Assign engineer')}`:`${empty('Everyone is assigned','All current engineers already have access.')}<div class="modal-actions"><button class="btn" data-action="close-modal">Close</button></div>`;}
      else if(kind==='unassign'){title='Remove engineer access?';desc=`${escapeHtml(u?.name)} will no longer be able to view ${escapeHtml(app().name)} logs and incidents.`;body=confirm('Remove access',true);}
      else if(kind==='key-create'){title='Generate API key';desc='Create a new ingestion credential for one application environment.';form='key-form';body=`<div class="form-grid"><div class="span-all">${formField('Key label','name','Application ingestion key','text','required')}</div>${formSelect('Environment','env',[['DEV','DEV'],['TEST','TEST'],['STAGING','STAGING']],'DEV')}</div>${buttons('','Generate key')}`;}
      else if(kind==='key-rotate'){title='Rotate API key?';desc=`Rotating ${escapeHtml(k?.name)} creates a new secret. The previous key can no longer be used.`;body=confirm('Rotate key',true);}
      else if(kind==='key-revoke'){title='Revoke API key?';desc=`The credential ${escapeHtml(k?.prefix)}… will immediately become invalid in this demo.`;body=confirm('Revoke key',true);}
      else if(kind==='key-reveal'){title='API key generated';desc='Copy this secret now. It will not be shown again after closing this dialog.';body=`<div class="tag orange">${ic('lock',13)} One-time secret</div><div class="secret-box" id="one-time-secret">${escapeHtml(state.secret||'')}</div><div class="hint-panel warning">${ic('info',16)}<span>For safety, the full key is only held in this page's temporary in-memory dialog state. This is a demo key, not a valid VaniOAK credential.</span></div><div class="modal-actions"><button class="btn" data-action="copy-secret">${ic('copy',15)} Copy key</button><button class="btn btn-primary" data-action="close-modal">Done</button></div>`;}
      else if(kind==='rule-create'||kind==='rule-edit'){title=rule?'Edit alert rule':'Create alert rule';desc='Threshold-based detection for ERROR and CRITICAL logs.';form='rule-form';body=`<div class="form-grid">${formSelect('Environment','env',[['DEV','DEV'],['TEST','TEST'],['STAGING','STAGING']],rule?.env||'DEV')}${formSelect('Severity','level',[['ERROR','ERROR'],['CRITICAL','CRITICAL']],rule?.level||'ERROR')}${formField('Threshold count','threshold',rule?.threshold??5,'number','min="1" required')}${formField('Window (seconds)','window',rule?.window??60,'number','min="1" required')}${formField('Cooldown (seconds)','cooldown',rule?.cooldown??300,'number','min="0" required')}${formField('Resolve after (seconds)','resolve',rule?.resolve??3600,'number','min="1" required')}${formSelect('Enabled','enabled',[['true','Enabled'],['false','Disabled']],String(rule?.enabled??true))}</div>${buttons('',''+(rule?'Save rule':'Create rule'))}`;}
      else if(kind==='resolve'){title='Resolve this incident?';desc=`Mark ${escapeHtml(i?.title||'incident')} as resolved. This changes only sample data.`;body=confirm('Confirm resolve');}
      else return '';
      return `<div class="modal-layer"><div class="modal-scrim" data-action="close-modal"></div><div class="modal-admin" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="eyebrow">VaniOAK · Admin</div><h2>${title}</h2><p>${desc}</p>${form?`<form class="modal-form" id="${form}">${body}</form>`:body}</div></div>`;
    }
    function render(){let path=(location.hash||'#/login').slice(1).split('?')[0];if(path==='/'||!path)path='/login';if(!state.auth&&path!=='/login'){location.hash='#/login';path='/login';}if(state.auth&&path==='/login'){location.hash='#/applications';path='/applications';}
      let html='';if(path==='/login')html=renderAdminLogin();else if(path==='/applications')html=fullPage(adminShell('applications')+renderAdminApps());else if(path==='/users')html=fullPage(adminShell('users')+renderAdminUsers());else {const m=path.match(/^\/applications\/([^/]+)\/(overview|logs|incidents|analytics|settings)(?:\/([^/]+))?$/);if(!m){location.hash='#/applications';html=fullPage(adminShell('applications')+renderAdminApps());}else{state.appId=apps.some(a=>a.id===m[1])?m[1]:apps[0].id;const page=m[2]==='incidents'&&m[3]?'detail':m[2];html=fullPage(adminShell(page,'workspace')+(page==='overview'?renderOverview():page==='logs'?renderLogs():page==='incidents'?renderIncidents():page==='analytics'?renderAnalytics():page==='settings'?renderSettings():renderDetail(m[3])));}}
      if(state.drawerId)html+=renderDrawer(state.drawerId);if(state.modal)html+=renderAdminModal();if(state.toast)html+=`<div class="toast">${ic('circleCheck',17)} ${escapeHtml(state.toast)}</div>`;el().innerHTML=html;
    }
    function toast(msg){state.toast=msg;render();clearTimeout(toast.timer);toast.timer=setTimeout(()=>{state.toast=null;render();},2600);}
    function preserveSearch(type){const ids={apps:'app-search',users:'user-search',logs:'log-search',incidents:'incident-search'};const node=document.getElementById(ids[type]);const at=node?node.selectionStart:0;render();const next=document.getElementById(ids[type]);if(next){next.focus();try{next.setSelectionRange(at,at);}catch(_){}}}
    document.addEventListener('submit',e=>{const form=e.target;e.preventDefault();if(form.id==='login-form'){state.auth=true;go('/applications');return;}const f=new FormData(form),m=state.modal;
      if(form.id==='app-form'){if(m?.kind==='app-create'){const name=String(f.get('name')).trim();if(apps.some(a=>a.name===name)){toast('Application name already exists');return;}const id=name.toLowerCase();apps.push({id,name,desc:String(f.get('description')),type:'Backend Service',color:'green',icon:'server',status:'ACTIVE',owner:String(f.get('owner')),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});environments[id]={DEV:true,TEST:true,STAGING:true};state.appId=id;}else {const a=apps.find(a=>a.id===m.id);if(a){a.name=String(f.get('name'));a.desc=String(f.get('description'));a.owner=String(f.get('owner'));}}state.modal=null;toast(m.kind==='app-create'?'Application created (demo)':'Application updated (demo)');}
      else if(form.id==='user-form'){const name=String(f.get('name')).trim(),email=String(f.get('email')).trim(),role=String(f.get('role')),status=String(f.get('status'));if(users.some(u=>u.email.toLowerCase()===email.toLowerCase()&&u.id!==m.id)){toast('Email already exists');return;}if(m.kind==='user-create'){const id='u'+(++userNumber);users.push({id,name,email,role,status,apps:[],last:'Never',initials:name.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase()});}else{const u=users.find(u=>u.id===m.id);if(u){Object.assign(u,{name,email,role,status});if(role==='ADMIN')u.apps=[];}}state.modal=null;toast('User saved (demo)');}
      else if(form.id==='assign-form'){const u=users.find(u=>u.id===f.get('userId'));if(u&&!u.apps.includes(state.appId))u.apps.push(state.appId);state.modal=null;toast('Engineer assigned (demo)');}
      else if(form.id==='key-form'){const secret=makeSecret(),prefix=secret.slice(0,12),id='key'+(++keyNumber);keys.unshift({id,appId:state.appId,name:String(f.get('name')),env:String(f.get('env')),prefix,status:'ACTIVE',created:'Today',used:'Never'});state.secret=secret;state.modal={kind:'key-reveal',id};render();}
      else if(form.id==='rule-form'){const parsed={appId:state.appId,env:String(f.get('env')),level:String(f.get('level')),threshold:Number(f.get('threshold')),window:Number(f.get('window')),cooldown:Number(f.get('cooldown')),resolve:Number(f.get('resolve')),enabled:f.get('enabled')==='true'};const existing=rules.find(r=>r.appId===state.appId&&r.env===parsed.env&&r.level===parsed.level&&r.id!==m?.id);if(existing){toast('A rule for this environment and level already exists');return;}if(m.kind==='rule-edit'){Object.assign(rules.find(r=>r.id===m.id),parsed)}else rules.push({id:'rule'+(++ruleNumber),...parsed});state.modal=null;toast('Alert rule saved (demo)');}
    });
    document.addEventListener('input',e=>{const search=e.target.dataset.search;if(!search)return;if(search==='apps')state.appQuery=e.target.value;else if(search==='users')state.userQuery=e.target.value;else if(search==='logs'){state.logQuery=e.target.value;state.logPage=0;}else if(search==='incidents')state.incidentQuery=e.target.value;preserveSearch(search);});
    document.addEventListener('change',e=>{if(e.target.id==='env-select'){state.env=e.target.value;state.logPage=0;render();}else if(e.target.id==='time-select'){state.time=e.target.value;state.logPage=0;render();}else if(e.target.id==='log-level'){state.logLevel=e.target.value;state.logPage=0;render();}else if(e.target.id==='incident-level'){state.incidentLevel=e.target.value;render();}});
    document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id,kind=target.dataset.kind;
      if(action==='apps'){state.modal=null;go('/applications');}
      else if(action==='users'){state.modal=null;go('/users');}
      else if(action==='logout'){state.auth=false;state.modal=null;state.secret=null;go('/login');}
      else if(action==='select-app'){state.appId=id;state.env='DEV';state.logPage=0;state.adminTab='general';go(appHash());}
      else if(action==='app-settings'){state.appId=id;state.adminTab='general';go(appHash('settings'));}
      else if(action==='nav')go(appHash(target.dataset.page));
      else if(action==='settings-tab'){state.adminTab=id;render();}
      else if(action==='app-filter'){state.applicationFilter=id;render();}
      else if(action==='user-role-filter'){state.userRole=id;render();}
      else if(action==='open-modal'){openModal(kind,id);}
      else if(action==='close-modal'){closeModal();}
      else if(action==='confirm-action'){const m=state.modal;if(!m)return;const a=apps.find(a=>a.id===m.id),u=users.find(u=>u.id===m.id),k=keys.find(k=>k.id===m.id),i=incidents.find(i=>i.id===m.id);
        if(m.kind==='app-toggle'&&a)a.status=a.status==='ACTIVE'?'DISABLED':'ACTIVE';
        if(m.kind==='user-toggle'&&u)u.status=u.status==='ACTIVE'?'DISABLED':'ACTIVE';
        if(m.kind==='env-toggle')environments[state.appId][m.id]=!environments[state.appId][m.id];
        if(m.kind==='unassign'&&u)u.apps=u.apps.filter(x=>x!==state.appId);
        if(m.kind==='key-revoke'&&k)k.status='REVOKED';
        if(m.kind==='key-rotate'&&k){state.secret=makeSecret();k.prefix=state.secret.slice(0,12);k.created='Today';k.used='Never';state.modal={kind:'key-reveal',id:k.id};render();return;}
        if(m.kind==='resolve'&&i&&i.status==='OPEN'){i.status='RESOLVED';i.resolvedAt=new Date().toISOString();i.resolutionSource='MANUAL';i.resolvedBy='Olivia Chen (Admin)';i.history.push({kind:'RESOLVED',at:i.resolvedAt,note:'Manually resolved by Olivia Chen'});}
        state.modal=null;toast('Changes saved (demo)');}
      else if(action==='copy-secret'){if(state.secret&&navigator.clipboard?.writeText)navigator.clipboard.writeText(state.secret).then(()=>toast('Secret copied')).catch(()=>toast('Clipboard unavailable'));else toast('Clipboard unavailable');}
      else if(action==='env-keys'){state.adminTab='keys';render();}
      else if(action==='rule-toggle'){const r=rules.find(r=>r.id===id);if(r)r.enabled=!r.enabled;toast('Alert rule updated (demo)');}
      else if(action==='incident')go(appHash('incidents/'+id));
      else if(action==='log'){state.drawerId=id;render();}
      else if(action==='close-drawer'){state.drawerId=null;render();}
      else if(action==='copy-trace'){const l=logs.find(x=>x.id===id);if(l&&navigator.clipboard?.writeText)navigator.clipboard.writeText(l.traceId).then(()=>toast('Trace ID copied')).catch(()=>toast('Clipboard unavailable'));else toast('Trace ID: '+(l?l.traceId:''));}
      else if(action==='toggle-live'){state.live=!state.live;render();}
      else if(action==='simulate'){const n=logs.length+1;logs.unshift({id:'new-'+n,level:'ERROR',message:'Payment provider timeout (demo event)',appId:state.appId,env:state.env==='ALL'?'DEV':state.env,timestamp:new Date().toISOString(),traceId:'demo-trace-'+n,host:'10.20.20.24',service:state.appId,span:'01002def0f12a56c',request:'req_demo_'+n});toast('Simulated ERROR log added');}
      else if(action==='log-prev'){state.logPage=Math.max(0,state.logPage-1);render();}
      else if(action==='log-next'){state.logPage++;render();}
      else if(action==='clear-logs'){state.logQuery='';state.logLevel='ALL';state.logPage=0;render();}
      else if(action==='incident-status'){state.incidentStatus=target.dataset.status;render();}
      else if(action==='resolve'){openModal('resolve',id);}
      else if(action==='incident-to-logs'){const i=incidents.find(x=>x.id===id);state.logQuery=i?i.title.split(' ').slice(0,3).join(' '):'';state.logPage=0;go(appHash('logs'));}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.drawerId){state.drawerId=null;render();}}});
    window.addEventListener('hashchange',render);
    if(!location.hash)location.hash='#/login';render();

  })();
</script>
</body>
