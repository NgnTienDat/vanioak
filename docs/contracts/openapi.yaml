openapi: 3.1.0
info:
  title: Log Monitoring Platform API
  version: 1.0.0
  description: >-
    REST API contract for the MVP, synchronized with docs/contracts/rest-api.md in Pass 2. Every
    JSON response uses the shared ApiResponse<T> envelope; named *Response schemas describe data
    payloads only. Inline specializations must not generate separate Java envelope classes.
    Services/modules do not return HTTP envelopes or response DTOs. Protected human APIs re-evaluate
    user status (disabled user: 403); disabled login/refresh or ingestion scope returns 401. Logout
    revokes the current refresh session and a supplied valid unexpired access token for the same user.
    Other sessions and historical reads remain authorized. Input length violations return 400 with field-to-message validation data before
    persistence. SSE retains its separate contract; other authoritative docs await Pass 3
    synchronization.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Auth
  description: Login, refresh, and logout.
- name: Users
  description: ENGINEER user management.
- name: Applications
  description: Applications and engineer assignments.
- name: API Keys
  description: Environment-scoped API-key list, create, rotate, and revoke.
- name: Log Ingestion
  description: Single and batch log ingestion.
- name: Log Search
  description: Authorized centralized log search.
- name: Analytics
  description: Hourly application health analytics.
- name: Incidents
  description: Incident list and detail.
- name: Alert Rules
  description: Alert-rule management.
paths:
  /auth/login:
    post:
      tags:
      - Auth
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: >-
        Authenticate an ACTIVE ADMIN or ENGINEER and issue access and refresh JWTs. Initial ADMIN is created by bootstrap, not REST.
        Invalid credentials or a DISABLED user return 401. Credentials/tokens must never be logged.
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh authentication tokens
      description: >-
        Authenticate the refresh_token in the JSON body; no Bearer access token is required.
        Successful refresh consumes the current single-use token and returns a rotated pair for the
        same session. The old token cannot be reused, including concurrently. Invalid, expired,
        revoked, consumed tokens or a DISABLED user return 401. Reuse of a consumed refresh JWT
        revokes its refresh session, including the current rotated token; other sessions/devices
        are unaffected. Refresh rotation or replay handling alone does not revoke access tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh authentication tokens successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current session
      description: >-
        Authenticate the current refresh JWT in the JSON body. An optional Authorization: Bearer
        header may carry the current access token; no access token is required. Revoke this refresh
        session, preventing future refresh; other sessions/devices remain active. If the supplied
        access token verifies, is unexpired and belongs to the same user, it cannot be reused after
        successful logout. A valid access token for a different user returns 401 without revocation.
        Missing, invalid or expired optional access tokens do not block logout with a valid refresh
        token. Other access tokens remain subject to expiry and normal authorization checks.
        The client discards local tokens after success. No forced SSE disconnection or revocation
        broadcast is introduced. Invalid, expired, revoked or consumed refresh tokens return 401.
        A required revocation dependency failure returns a safe 500, never a successful logout.
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout current session successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      tags:
      - Users
      summary: List ENGINEER users
      description: >-
        ACTIVE ADMIN only. Manages ENGINEER users only; ADMIN records cannot be managed through
        these operations. Non-Admin callers return 403. Includes disabled users unless filtered.
        Empty results return items=[] and next_cursor=null.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List ENGINEER users successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Users
      summary: Create ENGINEER user
      description: >-
        ACTIVE ADMIN only. Manages ENGINEER users only; ADMIN records cannot be managed through
        these operations. Non-Admin callers return 403. Creates an ACTIVE ENGINEER; role/status are
        fixed by the server, not create-request fields. Initial ADMIN uses bootstrap.
        Passwords/hashes are never returned. Duplicate username returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Create ENGINEER user successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: Get ENGINEER user
      description: >-
        ACTIVE ADMIN only. Manages ENGINEER users only; ADMIN records cannot be managed through
        these operations. Non-Admin callers or requests targeting ADMIN return 403; unknown user IDs
        return 404. Disabled ENGINEER records remain readable. Invalid UUID returns 400.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Get ENGINEER user successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Users
      summary: Update ENGINEER user
      description: >-
        ACTIVE ADMIN only. Manages ENGINEER users only; ADMIN records cannot be managed through
        these operations. Non-Admin callers or requests targeting ADMIN return 403; unknown user IDs
        return 404. Supports username/password/status, at least one required. Role changes are
        rejected with 400; duplicate username returns 409. Status ACTIVE explicitly reactivates a
        disabled ENGINEER. Passwords/hashes are never returned. Invalid UUID returns 400.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Update ENGINEER user successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Users
      summary: Disable ENGINEER user
      description: >-
        ACTIVE ADMIN only. Manages ENGINEER users only; ADMIN records cannot be managed through
        these operations. Non-Admin callers or requests targeting ADMIN return 403; unknown user IDs
        return 404. Soft delete sets status=DISABLED, retaining the user and access assignments.
        Repeating for an already-disabled ENGINEER returns its disabled state. Disabled users cannot
        log in or refresh; protected REST denies them with 403 and SSE follows disabled-user checks.
        This differs from logout. Invalid UUID returns 400.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Disable ENGINEER user successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /applications:
    get:
      tags:
      - Applications
      summary: List visible applications
      description: >-
        ADMIN sees all applications; ENGINEER sees assigned applications only. Response includes
        stored environment metadata; disabled scopes remain visible for authorized historical
        access.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Applications
      summary: Create application
      description: >-
        ADMIN only. Create the application and exactly three ACTIVE environments (DEV, TEST,
        STAGING) in the same transaction; if any creation fails, no records are committed. Response
        includes all three environments and their IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /applications/{applicationId}:
    patch:
      tags:
      - Applications
      summary: Update application
      description: >-
        ADMIN only. Update name/description/status. DISABLED blocks ingestion in every environment.
        Reactivating the application does not change environment statuses; existing DISABLED
        environments remain disabled. No separate REST environment create/update/enable/disable
        operations exist. Environment remains an entity with environment_id; existing SQL/status
        data is unchanged, with no automatic re-enable, synchronization or migration.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /applications/{applicationId}/engineers/{userId}:
    post:
      tags:
      - Applications
      summary: Assign engineer to application
      description: >-
        ADMIN only. Targets must be ENGINEER users; assignments are application-scoped and include
        all application environments. These operations do not change roles.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Applications
      summary: Remove engineer access
      description: >-
        ADMIN only. Targets must be ENGINEER users; assignments are application-scoped and include
        all application environments. These operations do not change roles.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /applications/{applicationId}/environments/{environmentId}/api-keys:
    get:
      tags:
      - API Keys
      summary: List ingestion API-key metadata
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EnvironmentId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - API Keys
      summary: Create ingestion API key
      description: ADMIN only. Requires an active application/environment scope; disabled scope returns 403.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EnvironmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Created; plaintext key returned once
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApiKeySecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api-keys/{credentialId}/rotate:
    post:
      tags:
      - API Keys
      summary: Rotate ingestion API key
      description: ADMIN only. Requires an active application/environment scope; disabled scope returns 403.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Rotated; plaintext replacement key returned once
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApiKeySecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api-keys/{credentialId}:
    delete:
      tags:
      - API Keys
      summary: Revoke ingestion API key
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logs:
    post:
      tags:
      - Log Ingestion
      security:
      - apiKeyAuth: []
      summary: Ingest one log
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
      responses:
        '202':
          description: Accepted by RabbitMQ
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Log Search
      summary: Search logs
      description: >-
        ADMIN can search all applications; ENGINEER can search assigned applications only. Results
        use timestamp DESC, event_id DESC; cursors preserve this order and the original filters. If
        from is supplied, to is required. Empty results return data.items=[] and
        data.next_cursor=null.
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/LogLevel'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: trace_id
        in: query
        schema:
          type: string
      - name: message
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logs/batch:
    post:
      tags:
      - Log Ingestion
      security:
      - apiKeyAuth: []
      summary: Ingest a batch of logs
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatchInput'
      responses:
        '202':
          description: Accepted by RabbitMQ
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/BatchIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analytics/health:
    get:
      tags:
      - Analytics
      summary: Get hourly application health analytics
      description: >-
        ADMIN can query all applications; ENGINEER can query assigned applications only. Empty
        datasets return data.bucket=hour and data.items=[].
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: bucket
        in: query
        schema:
          type: string
          enum:
          - hour
          default: hour
      responses:
        '200':
          description: Health analytics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/HealthAnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /incidents:
    get:
      tags:
      - Incidents
      summary: List incidents
      description: ADMIN sees all incidents; ENGINEER sees incidents for assigned applications only.
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/IncidentLevel'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /incidents/{incidentId}:
    get:
      tags:
      - Incidents
      summary: Get incident detail
      description: ADMIN can view all incidents; ENGINEER can view incidents for assigned applications only.
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/IncidentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /alert-rules:
    get:
      tags:
      - Alert Rules
      summary: List alert rules
      description: ADMIN only.
      responses:
        '200':
          description: Rule list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/AlertRuleListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      tags:
      - Alert Rules
      summary: Create alert rule
      description: ADMIN only. Requires an active application/environment scope; disabled scope returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /alert-rules/{ruleId}:
    patch:
      tags:
      - Alert Rules
      summary: Update alert rule
      description: >-
        ADMIN only. Enabling a rule requires an active application/environment scope; disabled scope
        returns 403. Rule disabling remains allowed.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRuleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Alert Rules
      summary: Disable alert rule
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/AlertRuleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ApiKey:
      name: X-API-Key
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: [object, 'null']
                  additionalProperties:
                    type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    TooManyRequests:
      description: Backpressure or rate limit
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
    InternalServerError:
      description: Unexpected server error; no stack traces or secrets are exposed.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiResponse'
            - type: object
              properties:
                success:
                  const: false
                data:
                  type: 'null'
  schemas:
    ApiResponse:
      type: object
      description: >-
        The single shared HTTP/API envelope ApiResponse<T>. Controllers specialize data with a
        payload DTO; services/modules do not return this type. Inline allOf specializations describe
        wire types and must not generate separate Java envelope classes. HTTP payload mapping may
        use MapStruct when appropriate. SSE events follow their separate contract.
      additionalProperties: false
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Safe for client display/logging.
        data: {}
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
    UserSummary:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - ENGINEER
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
          description: Short-lived access JWT; a valid unexpired token supplied at logout for the same user is revoked.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Access-token TTL in seconds; exact TTL is configured during implementation.
        user:
          $ref: '#/components/schemas/UserSummary'
        refresh_token:
          type: string
          description: Current single-use refresh JWT; rotated after each successful refresh. Reuse revokes this refresh session.
    ActionResponse:
      type: object
      required:
      - user_id
      - application_id
      properties:
        user_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
    ApplicationResponse:
      type: object
      required:
      - id
      - name
      - status
      - description
      - environments
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentSummary'
          description: >-
            Includes environment IDs and stored statuses. New applications have exactly DEV, TEST,
            STAGING, all initially ACTIVE; existing disabled environments are not re-enabled or
            migrated.
    ApplicationListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResponse'
        next_cursor:
          type:
          - string
          - 'null'
    CreateApplicationRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
    UpdateApplicationRequest:
      type: object
      properties:
        description:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        name:
          type: string
          maxLength: 100
    EnvironmentSummary:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - DEV
          - TEST
          - STAGING
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    LogLevel:
      type: string
      enum:
      - INFO
      - WARN
      - ERROR
      - CRITICAL
    IncidentLevel:
      type: string
      enum:
      - ERROR
      - CRITICAL
    LogInput:
      type: object
      required:
      - application
      - environment
      - host_ip
      - level
      - message
      - timestamp
      - trace_id
      properties:
        application:
          type: string
          maxLength: 100
        environment:
          type: string
          description: Lowercase aliases are normalized to canonical DEV/TEST/STAGING before API-key scope validation.
          enum:
          - DEV
          - TEST
          - STAGING
          - dev
          - test
          - staging
        host_ip:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
    LogBatchInput:
      type: object
      required:
      - logs
      properties:
        logs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LogInput'
    IngestResponse:
      type: object
      required:
      - accepted
      - request_id
      properties:
        accepted:
          type: boolean
          const: true
        request_id:
          type: string
          format: uuid
    BatchIngestResponse:
      type: object
      required:
      - accepted
      - accepted_count
      - request_id
      properties:
        accepted:
          type: boolean
          const: true
        accepted_count:
          type: integer
        request_id:
          type: string
          format: uuid
    LogRecord:
      type: object
      required:
      - event_id
      - application_id
      - environment_id
      - host_ip
      - level
      - message
      - timestamp
      - trace_id
      - received_at
      - processed_at
      properties:
        event_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        host_ip:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
    LogListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogRecord'
        next_cursor:
          type:
          - string
          - 'null'
    IncidentResponse:
      type: object
      required:
      - id
      - application
      - environment
      - level
      - status
      - fingerprint
      - message
      - error_count
      - first_seen_at
      - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        application:
          $ref: '#/components/schemas/ApplicationRef'
        environment:
          $ref: '#/components/schemas/EnvironmentRef'
        level:
          $ref: '#/components/schemas/IncidentLevel'
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
        fingerprint:
          type: string
        message:
          type: string
        error_count:
          type: integer
          format: int64
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvent'
    IncidentEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        event_at:
          type: string
          format: date-time
        error_count:
          type:
          - integer
          - 'null'
          format: int64
        message:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
    IncidentListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentResponse'
        next_cursor:
          type:
          - string
          - 'null'
    CreateAlertRuleRequest:
      type: object
      required:
      - environment_id
      - level
      - threshold
      - window_seconds
      - cooldown_seconds
      - resolve_after_seconds
      - enabled
      properties:
        environment_id:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/IncidentLevel'
        threshold:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1
        resolve_after_seconds:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        cooldown_seconds:
          type: integer
          minimum: 1
    UpdateAlertRuleRequest:
      type: object
      properties:
        threshold:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1
        resolve_after_seconds:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        cooldown_seconds:
          type: integer
          minimum: 1
    AlertRuleResponse:
      type: object
      required:
      - id
      - environment_id
      - level
      - threshold
      - window_seconds
      - cooldown_seconds
      - resolve_after_seconds
      - enabled
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/IncidentLevel'
        threshold:
          type: integer
        window_seconds:
          type: integer
        resolve_after_seconds:
          type: integer
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cooldown_seconds:
          type: integer
    AlertRuleListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRuleResponse'
        next_cursor:
          type:
          - string
          - 'null'
    HealthMetric:
      type: object
      required:
      - application_id
      - environment_id
      - timestamp
      - total_logs
      - error_logs
      - critical_logs
      - log_error_rate
      properties:
        application_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        total_logs:
          type: integer
          format: int64
        error_logs:
          type: integer
          format: int64
        critical_logs:
          type: integer
          format: int64
        log_error_rate:
          type: number
          format: double
    HealthAnalyticsResponse:
      type: object
      required:
      - bucket
      - items
      properties:
        bucket:
          type: string
          enum:
          - hour
        items:
          type: array
          items:
            $ref: '#/components/schemas/HealthMetric'
    ApiKeyResponse:
      type: object
      required:
      - id
      - environment_id
      - key_prefix
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        key_prefix:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          - EXPIRED
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    CreateApiKeyRequest:
      type: object
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    ApiKeySecretResponse:
      type: object
      required:
      - credential
      - api_key
      properties:
        credential:
          $ref: '#/components/schemas/ApiKeyResponse'
        api_key:
          type: string
          description: Returned only on create/rotate.
    ApiKeyListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'
        next_cursor:
          type:
          - string
          - 'null'
    ApplicationRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EnvironmentRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - DEV
          - TEST
          - STAGING
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Current refresh JWT for this session, supplied in the JSON body.
    LogoutRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Current refresh JWT for this session, supplied in the JSON body.
    RefreshTokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: Short-lived access JWT; a valid unexpired token supplied at logout for the same user is revoked.
        refresh_token:
          type: string
          description: Current single-use refresh JWT; rotated after each successful refresh. Reuse revokes this refresh session.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Access-token TTL in seconds; exact TTL is configured during implementation.
    UserResponse:
      type: object
      required:
      - id
      - username
      - role
      - status
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 100
        role:
          type: string
          const: ENGINEER
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    UserListResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        next_cursor:
          type:
          - string
          - 'null'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          writeOnly: true
      description: >-
        Creates an ACTIVE ENGINEER only. role and status are not accepted; role submission returns
        400. Password is stored only as a strong one-way hash.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          writeOnly: true
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      description: >-
        At least one supported field is required. role cannot be changed and is not accepted. A
        supplied password replaces the hash; setting ACTIVE explicitly reactivates a disabled
        ENGINEER.
