openapi: 3.1.0
info:
  title: Log Monitoring Platform API
  version: 1.0.0
  description: >-
    REST API contract for the MVP. All responses use the common response envelope.
    DISABLED-state behavior follows docs/quality/security.md: disabled login or
    ingestion scope returns 401; disabled-user protected access or management
    requiring an active scope returns 403. Historical reads remain authorized.
    Input length violations return 400 using ErrorResponse before persistence.
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /logs/batch:
    post:
      security:
      - apiKeyAuth: []
      summary: Ingest a batch of logs
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatchInput'
      responses:
        '202':
          description: Accepted by RabbitMQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /applications:
    get:
      summary: List visible applications
      description: ADMIN sees all applications; ENGINEER sees assigned applications only.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create application
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{applicationId}:
    patch:
      summary: Update application
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{applicationId}/environments:
    post:
      summary: Create environment
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{applicationId}/environments/{environmentId}:
    patch:
      summary: Update environment
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EnvironmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/environments/{environmentId}/api-keys:
    get:
      summary: List ingestion API-key metadata
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EnvironmentId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create ingestion API key
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EnvironmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Created; plaintext key returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api-keys/{credentialId}/rotate:
    post:
      summary: Rotate ingestion API key
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Rotated; plaintext replacement key returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api-keys/{credentialId}:
    delete:
      summary: Revoke ingestion API key
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/engineers/{userId}:
    post:
      summary: Assign engineer to application
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Remove engineer access
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /logs:
    post:
      security:
      - apiKeyAuth: []
      summary: Ingest one log
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
      responses:
        '202':
          description: Accepted by RabbitMQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      summary: Search logs
      description: ADMIN can search all applications; ENGINEER can search assigned applications only. Results use timestamp DESC, event_id DESC; cursors preserve this order and the original filters. If from is supplied, to is required.
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/LogLevel'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: trace_id
        in: query
        schema:
          type: string
      - name: message
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /incidents:
    get:
      summary: List incidents
      description: ADMIN sees all incidents; ENGINEER sees incidents for assigned applications only.
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/IncidentLevel'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /incidents/{incidentId}:
    get:
      summary: Get incident detail
      description: ADMIN can view all incidents; ENGINEER can view incidents for assigned applications only.
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /alert-rules:
    get:
      summary: List alert rules
      description: ADMIN only.
      responses:
        '200':
          description: Rule list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      summary: Create alert rule
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /alert-rules/{ruleId}:
    patch:
      summary: Update alert rule
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRuleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Disable alert rule
      description: ADMIN only.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /analytics/health:
    get:
      summary: Get hourly application health analytics
      description: ADMIN can query all applications; ENGINEER can query assigned applications only.
      parameters:
      - name: application_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: bucket
        in: query
        schema:
          type: string
          enum:
          - hour
          default: hour
      responses:
        '200':
          description: Health analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ApiKey:
      name: X-API-Key
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Backpressure or rate limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ResponseEnvelope:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    ErrorData:
      type: object
      required:
      - code
      - request_id
      - details
      properties:
        code:
          type: string
        request_id:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          $ref: '#/components/schemas/ErrorData'
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
    UserSummary:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - ENGINEER
    LoginData:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/UserSummary'
    LoginResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/LoginData'
    ActionData:
      type: object
      required:
      - user_id
      - application_id
      properties:
        user_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
    ActionResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ActionData'
    ApplicationSummary:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentSummary'
    ApplicationResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ApplicationSummary'
    ApplicationListData:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        next_cursor:
          type:
          - string
          - 'null'
    ApplicationListResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ApplicationListData'
    CreateApplicationRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
    UpdateApplicationRequest:
      type: object
      properties:
        description:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        name:
          type: string
          maxLength: 100
    CreateEnvironmentRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          enum:
          - DEV
          - TEST
          - STAGING
    EnvironmentSummary:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - DEV
          - TEST
          - STAGING
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    EnvironmentResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/EnvironmentSummary'
    LogLevel:
      type: string
      enum:
      - INFO
      - WARN
      - ERROR
      - CRITICAL
    IncidentLevel:
      type: string
      enum:
      - ERROR
      - CRITICAL
    LogInput:
      type: object
      required:
      - application
      - environment
      - host_ip
      - level
      - message
      - timestamp
      - trace_id
      properties:
        application:
          type: string
          maxLength: 100
        environment:
          type: string
          description: Lowercase aliases are normalized to canonical DEV/TEST/STAGING before API-key scope validation.
          enum:
          - DEV
          - TEST
          - STAGING
          - dev
          - test
          - staging
        host_ip:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
    LogBatchInput:
      type: object
      required:
      - logs
      properties:
        logs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LogInput'
    IngestData:
      type: object
      required:
      - accepted
      - request_id
      properties:
        accepted:
          type: boolean
          const: true
        request_id:
          type: string
          format: uuid
    IngestResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
